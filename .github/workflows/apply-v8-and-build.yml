name: Apply V8 and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply uploaded V8 patch
        run: 'ZIP=oka-bau-fazora-redesign-patch-v8-apk-ready.zip; test -f "$ZIP"; rm -rf /tmp/oka-v8; mkdir -p /tmp/oka-v8; unzip -q "$ZIP" -d /tmp/oka-v8; rsync -a --exclude=.git /tmp/oka-v8/ ./; echo "V8 patch applied"'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Corepack
        run: 'corepack enable'

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: 'yarn install'

      - name: Configure backend URL if secret exists
        working-directory: frontend
        env:
          BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
        run: 'if [ -n "$BACKEND_URL" ]; then printf "EXPO_PUBLIC_BACKEND_URL=%s\n" "$BACKEND_URL" > .env; else echo "No EXPO_PUBLIC_BACKEND_URL secret set"; fi'

      - name: Generate Android project
        working-directory: frontend
        env:
          CI: "1"
        run: 'npx expo prebuild --platform android --clean --no-install'

      - name: Build installable APK
        working-directory: frontend/android
        run: 'chmod +x gradlew && ./gradlew assembleDebug --no-daemon'

      - name: Prepare APK
        run: 'cp frontend/android/app/build/outputs/apk/debug/app-debug.apk OKA-Bau-OS.apk && ls -lh OKA-Bau-OS.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKA-Bau-OS-APK
          path: OKA-Bau-OS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit V8 source files to main
        continue-on-error: true
        run: 'git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; rm -f oka-bau-fazora-redesign-patch-v8-apk-ready.zip; git add -A; if ! git diff --cached --quiet; then git commit -m "Apply OKA Bau V8 redesign"; git push origin HEAD:main; else echo "No source changes to commit"; fi'
