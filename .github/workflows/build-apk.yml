name: Build OKA Bau OS APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BACKEND_URL: https://oka-control-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies and sync lockfile
        run: npm install --no-audit --no-fund
      - name: Check TypeScript and redesign integration
        run: |
          npm run typecheck
          npm run qa:redesign
      - name: Check Expo compatibility
        run: npx expo-doctor
      - name: Configure optional Firebase file
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Embed application for standalone use
        run: node scripts/prepare-standalone-debug.cjs
      - name: Assemble installable APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Verify and name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../OKA-Bau-OS.apk
          unzip -l ../OKA-Bau-OS.apk | grep 'assets/index.android.bundle'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose ../OKA-Bau-OS.apk
          "$BUILD_TOOLS/aapt" dump badging ../OKA-Bau-OS.apk
          sha256sum ../OKA-Bau-OS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OKA-Bau-OS-APK
          path: OKA-Bau-OS.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: APK-dependency-lock
          path: frontend/package-lock.json
          if-no-files-found: error
      - name: Persist synced dependency lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync Expo SDK 57 lockfile [skip ci]"
            git push
          fi
