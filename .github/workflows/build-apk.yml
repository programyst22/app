name: Build OKA Bau OS APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL || vars.EXPO_PUBLIC_BACKEND_URL || 'https://oka-build-platform.preview.emergentagent.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed V8 source patch once
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          archive = root / 'OKA-Bau-Android-build-fixes.zip'
          marker = root / '.oka-android-patch-applied'
          expected = '3b2b95a5c660bfa2840103d36222596ae7b0c009a92444e90571ed068f0256ff'
          if marker.exists() and marker.read_text().strip() == expected:
              print('Reviewed source patch already applied; preserving subsequent fixes')
              raise SystemExit(0)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Unexpected patch archive'
          files = []
          with zipfile.ZipFile(archive) as patch:
              for entry in patch.infolist():
                  if entry.is_dir() or entry.filename.startswith('.github/'):
                      continue
                  relative = pathlib.PurePosixPath(entry.filename)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.parts[0] == 'frontend' or len(relative.parts) == 1
                  target = root.joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(patch.read(entry))
                  files.append(entry.filename)
          marker.write_text(expected + '\n')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *files, marker.name], check=True)
          subprocess.run(['git', 'commit', '-m', 'Apply V8 redesign and verified Android build fixes'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and redesign integration
        run: |
          npm run typecheck
          npm run qa:redesign
      - name: Check Expo compatibility
        run: npx expo-doctor
      - name: Configure optional Firebase file
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Embed application for standalone use
        run: node scripts/prepare-standalone-debug.cjs
      - name: Assemble installable APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Verify and name APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../OKA-Bau-OS.apk
          unzip -l ../OKA-Bau-OS.apk | grep 'assets/index.android.bundle'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose ../OKA-Bau-OS.apk
          "$BUILD_TOOLS/aapt" dump badging ../OKA-Bau-OS.apk
          sha256sum ../OKA-Bau-OS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OKA-Bau-OS-APK
          path: OKA-Bau-OS.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save resolved dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: APK-dependency-lock
          path: frontend/package-lock.json
          if-no-files-found: error
