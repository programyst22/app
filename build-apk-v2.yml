name: Build APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk-v2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V8 patch
        run: | test -f oka-bau-fazora-redesign-patch-v8-apk-ready.zip rm -rf /tmp/oka-v8 mkdir -p /tmp/oka-v8 unzip -q oka-bau-fazora-redesign-patch-v8-apk-ready.zip -d /tmp/oka-v8 rsync -a --exclude='.git' /tmp/oka-v8/ ./ 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Expo prebuild
        working-directory: frontend
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: frontend/android
        run: | chmod +x gradlew ./gradlew assembleDebug --no-daemon 
      - name: Copy APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk OKA-Bau-OS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKA-Bau-OS-APK
          path: OKA-Bau-OS.apk
          if-no-files-found: error
          retention-days: 30
